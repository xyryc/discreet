# import local private secrets if the file exists
spring.config.import=optional:application-local.properties

# 1. Dynamic Server Port (Defaults to 8080 locally, or Render's PORT)
server.port=${PORT:8080}

# 2. Database Connection (Defaults to H2 locally, or Supabase in Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:discreetdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# 3. Hibernate JPA (Auto-creates and updates tables in PostgreSQL/H2)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# 4. Local H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 5. JWT Secret Key & Expiration (7 days in milliseconds)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=604800000

# 6. S3-Compatible Object Storage (Supabase / AWS / Cloudflare R2 / MinIO)
app.s3.endpoint=${S3_ENDPOINT:}
app.s3.region=${S3_REGION:ap-southeast-1}
app.s3.access-key=${S3_ACCESS_KEY:discreet_dev_key}
app.s3.secret-key=${S3_SECRET_KEY:discreet_dev_secret}
app.s3.bucket-name=${S3_BUCKET_NAME:discreet-storage}
app.s3.public-url-prefix=${S3_PUBLIC_URL_PREFIX:}

# 7. File Upload Size Limits (Up to 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB