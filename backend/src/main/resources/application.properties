# 1. Dynamic Server Port (Defaults to 8080 locally, or Render's PORT)                                               
    server.port=${PORT:8080}  

# 2. Database Connection (Defaults to H2 locally, or Supabase in Cloud)                               
    spring.h2.console.enabled=true                             
    spring.h2.console.path=/h2-console                         
                                                               
# 3. Database Connection                                   
    spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:discreetdb}
    spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}                           
    spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}   
                                                               
# 4. Hibernate JPA (Auto-creates and updates tables in PostgreSQL/H2)                        
    spring.jpa.hibernate.ddl-auto=update 
    spring.jpa.show-sql=true     
    spring.jpa.open-in-view=false