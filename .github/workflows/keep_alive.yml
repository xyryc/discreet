name: Keep Discreet Backend Alive 24/7

on:
  schedule:
    # Runs every 10 minutes (cron: minute hour day month day-of-week)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual 1-click "Run workflow" from GitHub UI

jobs:
  ping-health:
    runs-on: ubuntu-latest
    name: Ping Health Endpoint
    steps:
      - name: Ping Discreet Backend
        run: |
          URL="https://discreet-backend.onrender.com/api/v1/health"
          echo "Pinging $URL at $(date -u)..."
          
          # Send GET request and capture HTTP status code
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "HTTP Status Code: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ SUCCESS: Discreet backend is online and healthy!"
          else
            echo "⚠️ WARNING: Backend returned status $HTTP_STATUS"
          fi
